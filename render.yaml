services:
  - type: web
    name: life-archive-mcp
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    region: singapore
    healthCheckPath: /api/v1/ready
    autoDeployTrigger: commit
    maxShutdownDelaySeconds: 30
    envVars:
      - key: NODE_ENV
        value: production
      - key: HERMES_HOST
        value: 0.0.0.0
      - key: HERMES_RUNTIME_DATABASE_URL
        sync: false
      - key: LIFE_ARCHIVE_AUTH0_ISSUER
        sync: false
      - key: LIFE_ARCHIVE_AUTH0_AUDIENCE
        sync: false
      - key: LIFE_ARCHIVE_AUTH0_ALLOWED_SUBJECTS
        sync: false
      - key: LIFE_ARCHIVE_AUTH0_MAX_ACCESS_TOKEN_LIFETIME_SECONDS
        value: "3600"
      - key: HERMES_SECRET_STORE
        value: env
      - key: HERMES_ALLOW_REMOTE_WRITES
        value: "true"
      - key: HERMES_ENABLE_LEGACY_ROUTES
        value: "false"
      - key: HERMES_TRUST_PROXY_HOPS
        value: "1"
      - key: HERMES_AUTH_RATE_LIMIT_ENABLED
        value: "true"
      - key: HERMES_AUTH_RATE_LIMIT_MAX_FAILURES
        value: "10"
      - key: HERMES_AUTH_RATE_LIMIT_WINDOW_MS
        value: "300000"
      - key: HERMES_AUTH_RATE_LIMIT_BLOCK_MS
        value: "900000"
      - key: HERMES_AUTH_RATE_LIMIT_MAX_ENTRIES
        value: "5000"
      - key: HERMES_DATABASE_MAX_CONNECTIONS
        value: "5"
      - key: HERMES_DATABASE_CONNECTION_TIMEOUT_MS
        value: "10000"
      - key: HERMES_DATABASE_IDLE_TIMEOUT_MS
        value: "30000"
      - key: HERMES_EMBEDDING_PROVIDER
        value: disabled
