services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ultimate-hermes-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hermes
      POSTGRES_PASSWORD: hermes
      POSTGRES_DB: hermes
    ports:
      - "55432:5432"
    volumes:
      - hermes-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hermes -d hermes"]
      interval: 5s
      timeout: 5s
      retries: 20

  hermes:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ultimate-hermes-app
    profiles: ["app"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HERMES_DATABASE_URL: postgres://hermes:hermes@postgres:5432/hermes
      HERMES_PORT: 8787
      HERMES_HOST: 0.0.0.0
      HERMES_DATA_DIR: /app/.hermes
      HERMES_EMBEDDING_PROVIDER: local
      HERMES_EMBEDDING_DIMENSIONS: 1536
    ports:
      - "8787:8787"
    volumes:
      - hermes-app-data:/app/.hermes
    command: ["sh", "-lc", "node dist/src/cli/index.js migrate && node dist/src/server/index.js"]

volumes:
  hermes-postgres-data:
  hermes-app-data:
