services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ultimate-hermes-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hermes
      POSTGRES_PASSWORD: ${HERMES_POSTGRES_PASSWORD:-hermes}
      POSTGRES_DB: hermes
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - hermes-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hermes -d hermes"]
      interval: 5s
      timeout: 5s
      retries: 20

  hermes:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ultimate-hermes-app
    profiles: ["app"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HERMES_DATABASE_URL: postgres://hermes:${HERMES_POSTGRES_PASSWORD:-hermes}@postgres:5432/hermes
      HERMES_API_TOKEN: ${HERMES_API_TOKEN:-local-development-token}
      HERMES_PORT: 8787
      HERMES_HOST: 0.0.0.0
      HERMES_PUBLIC_BASE_URL: http://127.0.0.1:8787
      HERMES_SECRET_STORE: env
      HERMES_ALLOW_REMOTE_WRITES: "true"
      HERMES_ENABLE_LEGACY_ROUTES: "false"
      HERMES_DATA_DIR: /app/.hermes
      HERMES_EMBEDDING_PROVIDER: disabled
      HERMES_EMBEDDING_DIMENSIONS: 1536
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - hermes-app-data:/app/.hermes

volumes:
  hermes-postgres-data:
  hermes-app-data:
